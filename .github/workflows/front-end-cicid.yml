
name: Upload Frontend to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Vérifier les claims OIDC émis par GitHub
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -er '.value')
          export TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("OIDC sub:", claims.get("sub"))
          print("OIDC aud:", claims.get("aud"))
          PY

      # 3. S'authentifier auprès d'AWS avec OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-3

      # 4. Vérifier l'identité AWS
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 5. Synchroniser le frontend vers S3
      - name: Sync website to S3
        run: |
          aws s3 sync website/ \
            "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --region eu-west-3

      # 6. Invalider le cache CloudFront
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
